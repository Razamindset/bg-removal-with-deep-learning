seed: 42

# data
data_root: /kaggle/working/data          # on Kaggle: point this at the attached Pets input
val_fraction: 0.1
image_size: 256
num_workers: 4

# training
batch_size: 64             # nearly fills 2x T4; drop to 32 if you hit OOM
epochs: 100                # max epochs; early stopping will cut this short
lr: 1.0e-3                 # decoder + head initial learning rate
encoder_lr: 1.0e-4         # pretrained encoder learns slower
min_lr: 1.0e-6             # minimum learning rate for Cosine scheduler
loss: bce_dice
patience: 10               # early stopping patience epochs
freeze_epochs: 3           # freeze pretrained encoder for initial epochs to stabilize decoder
max_grad_norm: 1.0         # gradient clipping threshold
scheduler: cosine          # learning rate scheduler ('cosine' or 'none')

# model
encoder: resnet34
pretrained: true

# output
output_dir: /kaggle/working/outputs      # on Kaggle: /kaggle/working/outputs